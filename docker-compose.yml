services:
  db:
    image: postgres:15
    container_name: commission-db
    environment:
      POSTGRES_DB: ${DB_NAME:-commissions}
      POSTGRES_USER: ${DB_USER:-commission}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5433:5432" # dev convenience (tests, psql); remove when hosting so only the backend can reach the database
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: commission-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # these override application.properties (Spring maps SPRING_DATASOURCE_URL to spring.datasource.url)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-commissions}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-commission}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SPRING_PROFILES_ACTIVE: prod
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata: