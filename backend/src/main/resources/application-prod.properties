# activated with SPRING_PROFILES_ACTIVE=prod
# no default: the app refuses to start without JWT_SECRET instead of silently using the dev secret
app.jwt.secret=${JWT_SECRET}
app.ratelimit.enabled=true
# trust X-Forwarded-For only from the platform's own proxy, so the register limit sees real client IPs
server.forward-headers-strategy=native
# small free-tier database: few connections, and let idle ones close so the database can go to sleep
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000